// calls/client/peer_message.proto
//
// Transcribed from docs/huddles-peer-messages.md, which recovered this schema
// from the protobuf-es embedded file descriptor in Slack's shipped webapp
// bundle (webpack module `px0L` of gantry-v2-vendors-client).
//
// Field numbers and enum values come from that descriptor, not from guesses.
syntax = "proto3";

package slack.calls.client;

message PeerMessage {
  Reacji reacji = 1;
  Draw draw = 2;
  uint64 fromPeerId = 3; // legacy; the client sends fromPeerIdString
  string fromPeerIdString = 4;
  Capabilities capabilities = 5;
  Background background = 6;
  MuteRequest muteRequest = 10;
  AwarenessBroadcast awarenessBroadcast = 11;
  AwarenessQuery awarenessQuery = 12;
  AwarenessClose awarenessClose = 13;
  JukeboxRequest jukeboxRequest = 14;
  ContentShareDetails contentShareDetails = 15;
  RecordingStartNotification recordingStartNotification = 16;
  TranscriptCatchUp transcriptCatchUp = 17;
  KickNotification kickNotification = 18;

  message Reacji {
    enum Type {
      Unknown_reaction_type = 0;
      Effect = 1;
      Standard = 2;
      Gif = 3;
    }
    string emoji = 1;
    Type type = 2;
    string emojiUrl = 3;
  }

  message Point {
    double x = 1;
    double y = 2;
  }

  // Cubic Bezier: a = start, b/c = control points, d = end.
  message Segment {
    Point a = 1;
    Point b = 2;
    Point c = 3;
    Point d = 4;
  }

  message Draw {
    enum Type {
      UNKNOWN_DRAW_TYPE = 0;
      NEW = 1;
      EDIT = 2;
      END = 3;
      CHANGE_HUE = 4;
      POSITION = 5;
    }
    Type type = 1;
    Segment segment = 2;
    int32 hue = 3;
    string itemId = 4;
    double x = 5;
    double y = 6;
  }

  message Capabilities {
    bool isDrawEnabled = 1;
  }

  message ContentShareDetails {
    string sourceType = 1;
    string itemId = 2;
  }

  message Background {
    string url = 1;
  }

  message MuteRequest {
    string peerId = 1;
  }

  message JukeboxRequest {
    string songKey = 1;
    bool stop = 2;
  }

  message RecordingStartNotification {
    enum Type {
      UNKNOWN_TYPE = 0;
      SUMMARY = 1;
    }
    Type type = 1;
    string recordingType = 2;
  }

  message KickNotification {
    string kickedUserId = 1;
  }

  message TranscriptCatchUp {
    enum Type {
      SOLICIT = 0;
      OFFER = 1;
      REQUEST_FROM = 2;
      RESPONSE = 3;
      RESPONSE_CHUNK = 4;
    }
    Type type = 1;
    repeated TranscriptLine lines = 2;
    uint32 chunk_index = 3;
    uint32 total_chunks = 4;
    string request_id = 5;
    uint64 earliest_transcript_timestamp_ms = 6;
  }

  message TranscriptLine {
    string user_id = 1;
    string content = 2;
    uint64 start_time_ms = 3;
    uint64 end_time_ms = 4;
  }

  message AwarenessPayload {
    string field_name = 1;
    string field_value = 2;
    optional int64 field_timestamp_ms = 3;
  }

  message AwarenessBroadcast {
    string channel = 1;
    string user = 2;
    repeated AwarenessPayload awarenessState = 3;
  }

  message AwarenessQuery {
    string channel = 1;
    string user = 2;
  }

  message AwarenessClose {
    string channel = 1;
    string user = 2;
  }
}
